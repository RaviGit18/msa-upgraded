spring:
  application:
    name: employee-service
  config:
    import: optional:configserver:http://localhost:8888
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  profiles:
    active: dev

server:
  port: 8080

eureka:
  client:
    service-url:
      default-zone: http://localhost:8761/eureka/
