spring.application.name=zuul-edge-server
server.port=9090
eureka.client.service-url.default-zone=http://localhost:8761/eureka/
spring.config.import=optional:configserver:http://localhost:8888

# Spring Cloud Gateway routing
spring.cloud.gateway.routes[0].id=employee-service
spring.cloud.gateway.routes[0].uri=lb://employee-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/employee-service/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[1].id=role-service
spring.cloud.gateway.routes[1].uri=lb://role-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/role-service/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[2].id=employee-payroll-service
spring.cloud.gateway.routes[2].uri=lb://employee-payroll-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/employee-payroll-service/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true