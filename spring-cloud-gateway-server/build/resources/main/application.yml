spring:
  application:
    name: spring-cloud-gateway-server
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    gateway:
      routes:
        - id: employee-service
          uri: lb://employee-service
          predicates:
            - Path=/employee-service/**
          filters:
            - StripPrefix=1
        - id: role-service
          uri: lb://role-service
          predicates:
            - Path=/role-service/**
          filters:
            - StripPrefix=1
        - id: employee-payroll-service
          uri: lb://employee-payroll-service
          predicates:
            - Path=/employee-payroll-service/**
          filters:
            - StripPrefix=1
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

server:
  port: 9090

eureka:
  client:
    service-url:
      default-zone: http://localhost:8761/eureka/
